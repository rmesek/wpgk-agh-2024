<!DOCTYPE html>
<!-- It's the HTML5 standard. -->

<html lang="">

<head>
    <title>Example 01 - triangle and square</title>
    <meta http-equiv="content-type" content="text/html; charset=ISO-8859-1">

    <!-- The following meta line optimizes the site for mobile devices. 
		 It sets the viewport size to the screen size, so it will be displayed maximized, but unscaled. -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1">
    <style>
        body {
            /* Set the background color of the HTML page to black */
            background-color: #000000;

            /* Hide oversize content. This prevents the scroll bars. */
            overflow: hidden;
        }
    </style>
    <!-- Include Three.js library -->
    <script src="three.js"></script>
</head>

<body>
<!-- This is the DIV element which will contain the WebGL canvas. To be identifiable later on, the id 'WebGLCanvas' is applied to it. -->
<div id="WebGLCanvas"></div>

<!-- This JavaScript block encloses the Three.js commands -->
<script>
    // Global scene object
    let scene;

    // Global camera object
    let camera;

    let renderer;

    let canvasWidth, canvasHeight;

    const christmasTree = new THREE.Group();
    const house = new THREE.Group();
    const car = new THREE.Group();
    const christmasTree3D = new THREE.Group();
    let carMoves = 0;
    let carDirection = 1;

    // Initialize the scene
    initializeScene();

    // Animate the scene
    animateScene();

    // Render the scene (map the 3D world to the 2D scene)
    renderScene();

    /**
     * Initialize the scene.
     */
    function initializeScene() {

        renderer = new THREE.WebGLRenderer({antialias: true});

        // Set the background color of the renderer to black, with full opacity
        renderer.setClearColor(0x000000, 1);

        // Get the size of the inner window (content area) to create a full size renderer
        canvasWidth = window.innerWidth;
        canvasHeight = window.innerHeight;

        // Set the renderers size to the content areas size
        renderer.setSize(canvasWidth, canvasHeight);

        // Get the DIV element from the HTML document by its ID and append the renderers DOM
        // object to it
        document.getElementById("WebGLCanvas").appendChild(renderer.domElement);

        // Create the scene, in which all objects are stored (e.g. camera, lights,
        // geometries, ...)
        scene = new THREE.Scene();

        // Define camera and add it to the scene.
        camera = new THREE.PerspectiveCamera(45, canvasWidth / canvasHeight, 1, 100);
        camera.position.set(3, 3, 10);
        camera.lookAt(scene.position);
        scene.add(camera);

        // Christmas tree 2D
        {
            const christmasTreeSegment = new THREE.Group();
            const triangleGeometry = new THREE.Geometry();
            triangleGeometry.vertices.push(new THREE.Vector3(-0.5, 0, 0));
            triangleGeometry.vertices.push(new THREE.Vector3(0.5, 0, 0));
            triangleGeometry.vertices.push(new THREE.Vector3(0, 1, 0));
            triangleGeometry.faces.push(new THREE.Face3(0, 1, 2));
            const triangleMaterial = new THREE.MeshBasicMaterial({color: 0x00ff00, side: THREE.DoubleSide});
            const triangleMesh = new THREE.Mesh(triangleGeometry, triangleMaterial);
            triangleMesh.position.set(0, 0.25, 0);
            christmasTreeSegment.add(triangleMesh);

            const perpendicularTriangleMesh = triangleMesh.clone();
            perpendicularTriangleMesh.rotation.y = Math.PI / 2;
            christmasTreeSegment.add(perpendicularTriangleMesh);
            christmasTree.add(christmasTreeSegment);

            const secondSegment = christmasTreeSegment.clone();
            secondSegment.position.set(0, 0.5, 0);
            christmasTree.add(secondSegment);

            const thirdSegment = christmasTreeSegment.clone();
            thirdSegment.position.set(0, 1, 0);
            christmasTree.add(thirdSegment);


            const trunkSegment = new THREE.Group();
            const trunkGeometry = new THREE.Geometry();
            trunkGeometry.vertices.push(new THREE.Vector3(-0.25, 0, 0));
            trunkGeometry.vertices.push(new THREE.Vector3(0.25, 0, 0));
            trunkGeometry.vertices.push(new THREE.Vector3(0.25, 0.25, 0));
            trunkGeometry.vertices.push(new THREE.Vector3(-0.25, 0.25, 0));
            trunkGeometry.faces.push(new THREE.Face3(0, 1, 2));
            trunkGeometry.faces.push(new THREE.Face3(0, 2, 3));
            const trunkMaterial = new THREE.MeshBasicMaterial({color: 0x964b00, side: THREE.DoubleSide});
            const trunkMesh = new THREE.Mesh(trunkGeometry, trunkMaterial);
            trunkMesh.position.set(0, 0, 0);
            trunkSegment.add(trunkMesh);

            const perpendicularTrunkMesh = trunkMesh.clone();
            perpendicularTrunkMesh.rotation.y = Math.PI / 2;
            trunkSegment.add(perpendicularTrunkMesh);

            christmasTree.add(trunkSegment);
        }

        // House (square and triangle)
        {
            let epsilon = 1e-3;
            const squareGeometry = new THREE.Geometry();
            squareGeometry.vertices.push(new THREE.Vector3(-0.5, 0, 0));
            squareGeometry.vertices.push(new THREE.Vector3(0.5, 0, 0));
            squareGeometry.vertices.push(new THREE.Vector3(0.5, 1, 0));
            squareGeometry.vertices.push(new THREE.Vector3(-0.5, 1, 0));
            squareGeometry.faces.push(new THREE.Face3(0, 1, 2));
            squareGeometry.faces.push(new THREE.Face3(0, 2, 3));
            const squareMaterial = new THREE.MeshBasicMaterial({color: 0xff0000, side: THREE.DoubleSide});
            const squareMesh = new THREE.Mesh(squareGeometry, squareMaterial);
            squareMesh.position.set(0, 0.5, 0);
            house.add(squareMesh);

            const triangleGeometry = new THREE.Geometry();
            triangleGeometry.vertices.push(new THREE.Vector3(-0.5, 0, 0));
            triangleGeometry.vertices.push(new THREE.Vector3(0.5, 0, 0));
            triangleGeometry.vertices.push(new THREE.Vector3(0, 1, 0));
            triangleGeometry.faces.push(new THREE.Face3(0, 1, 2));
            const triangleMaterial = new THREE.MeshBasicMaterial({color: 0x00aa00, side: THREE.DoubleSide});
            const triangleMesh = new THREE.Mesh(triangleGeometry, triangleMaterial);
            triangleMesh.position.set(0, 1.5, 0);
            house.add(triangleMesh);

            const doorGeometry = new THREE.Geometry();
            doorGeometry.vertices.push(new THREE.Vector3(-0.15, 0, 0));
            doorGeometry.vertices.push(new THREE.Vector3(0.15, 0, 0));
            doorGeometry.vertices.push(new THREE.Vector3(0.15, 0.5, 0));
            doorGeometry.vertices.push(new THREE.Vector3(-0.15, 0.5, 0));
            doorGeometry.faces.push(new THREE.Face3(0, 1, 2));
            doorGeometry.faces.push(new THREE.Face3(0, 2, 3));
            const doorMaterial = new THREE.MeshBasicMaterial({color: 0x964b00, side: THREE.DoubleSide});
            const doorMesh = new THREE.Mesh(doorGeometry, doorMaterial);
            doorMesh.position.set(0.2, 0.5, epsilon);
            house.add(doorMesh);

            const windowGeometry = new THREE.Geometry();
            windowGeometry.vertices.push(new THREE.Vector3(-0.2, 0, 0));
            windowGeometry.vertices.push(new THREE.Vector3(0.2, 0, 0));
            windowGeometry.vertices.push(new THREE.Vector3(0.2, 0.4, 0));
            windowGeometry.vertices.push(new THREE.Vector3(-0.2, 0.4, 0));
            windowGeometry.faces.push(new THREE.Face3(0, 1, 2));
            windowGeometry.faces.push(new THREE.Face3(0, 2, 3));
            const windowMaterial = new THREE.MeshBasicMaterial({color: 0x0000aa, side: THREE.DoubleSide});
            const windowMesh = new THREE.Mesh(windowGeometry, windowMaterial);
            windowMesh.position.set(-0.25, 1, epsilon);
            house.add(windowMesh);
        }

        // Car (rectangle and 2 circles)
        {
            const circleGeometry = new THREE.CircleGeometry(0.125, 32);
            const circleMaterial = new THREE.MeshBasicMaterial({color: 0x222222, side: THREE.DoubleSide});
            const circleMesh1 = new THREE.Mesh(circleGeometry, circleMaterial);
            circleMesh1.position.set(-0.3, 0, 0);
            car.add(circleMesh1);

            const circleMesh2 = circleMesh1.clone();
            circleMesh2.position.set(0.3, 0, 0);
            car.add(circleMesh2);

            const rectangleGeometry = new THREE.Geometry();
            rectangleGeometry.vertices.push(new THREE.Vector3(-0.5, 0, 0));
            rectangleGeometry.vertices.push(new THREE.Vector3(0.5, 0, 0));
            rectangleGeometry.vertices.push(new THREE.Vector3(0.5, 0.5, 0));
            rectangleGeometry.vertices.push(new THREE.Vector3(-0.5, 0.5, 0));
            rectangleGeometry.faces.push(new THREE.Face3(0, 1, 2));
            rectangleGeometry.faces.push(new THREE.Face3(0, 2, 3));
            rectangleGeometry.faces[0].vertexColors[0] = new THREE.Color(0xff0000);
            rectangleGeometry.faces[0].vertexColors[1] = new THREE.Color(0x00ff00);
            rectangleGeometry.faces[0].vertexColors[2] = new THREE.Color(0x0000ff);
            rectangleGeometry.faces[1].vertexColors[0] = new THREE.Color(0xff0000);
            rectangleGeometry.faces[1].vertexColors[1] = new THREE.Color(0x0000ff);
            rectangleGeometry.faces[1].vertexColors[2] = new THREE.Color(0x00ff00);
            const rectangleMaterial = new THREE.MeshBasicMaterial({vertexColors:THREE.VertexColors, side: THREE.DoubleSide});
            const rectangleMesh = new THREE.Mesh(rectangleGeometry, rectangleMaterial);
            rectangleMesh.position.set(0, 0.125, 0);
            car.add(rectangleMesh);
        }

        // Christmas tree 3D Cone
        {
            const christmasTree3DSegment = new THREE.Group();
            const cylinderGeometry = new THREE.CylinderGeometry(0.2, 0.5, 0.5, 4);
            const cylinderMaterial = new THREE.MeshBasicMaterial({color: 0x00ff00, side: THREE.DoubleSide});
            const coneMesh = new THREE.Mesh(cylinderGeometry, cylinderMaterial);
            coneMesh.position.set(0, 0.5, 0);
            christmasTree3DSegment.add(coneMesh);
            christmasTree3D.add(christmasTree3DSegment);

            const secondSegment = christmasTree3DSegment.clone();
            secondSegment.position.set(0, 0.5, 0);
            christmasTree3D.add(secondSegment);

            const topSegmentGeometry = new THREE.ConeGeometry(0.5, 1, 4);
            const topSegmentMaterial = new THREE.MeshBasicMaterial({color: 0x00ff00, side: THREE.DoubleSide});
            const topSegmentMesh = new THREE.Mesh(topSegmentGeometry, topSegmentMaterial);
            topSegmentMesh.position.set(0, 1.75, 0);
            christmasTree3D.add(topSegmentMesh);

            const trunkGeometry = new THREE.CylinderGeometry(0.25, 0.25, 0.25, 4);
            const trunkMaterial = new THREE.MeshBasicMaterial({color: 0x964b00, side: THREE.DoubleSide});
            const trunkMesh = new THREE.Mesh(trunkGeometry, trunkMaterial);
            trunkMesh.position.set(0, 0.125, 0);
            christmasTree3D.add(trunkMesh);
        }

        christmasTree.position.set(2.5, 0, 0);
        scene.add(christmasTree);

        house.position.set(0, 0, 0);
        scene.add(house);

        car.position.set(0, 0, 1);
        scene.add(car);

        christmasTree3D.position.set(-2.5, 0, 0);
        scene.add(christmasTree3D);
    }

    function animateScene() {
        christmasTree.rotation.y += 0.1;

        if (carMoves > 100) {
            carDirection = -1;
        } else if (carMoves <= 0) {
            carDirection = 1;
        }
        car.position.x += carDirection * 0.02;
        carMoves += carDirection;

        requestAnimationFrame(animateScene);

        // Map the 3D scene down to the 2D screen (render the frame)
        renderScene();
    }

    /**
     * Render the scene. Map the 3D world to the 2D screen.
     */
    function renderScene() {
        renderer.render(scene, camera);
    }
</script>
</body>

</html>
