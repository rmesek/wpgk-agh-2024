<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title></title>
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body>
    <div class="viewport"></div>

    <script src="three.min.js"></script>
    <script src="physi.js"></script>
    <script>
      var container, scene, renderer, camera, light, ball, plane;
      var WIDTH, HEIGHT, VIEW_ANGLE, ASPECT, NEAR, FAR;

      var clock = new THREE.Clock();

      Physijs.scripts.worker = "physijs_worker.js";
      Physijs.scripts.ammo = "ammo.js";

      container = document.querySelector(".viewport");

      (WIDTH = window.innerWidth), (HEIGHT = window.innerHeight);

      (VIEW_ANGLE = 60), (ASPECT = WIDTH / HEIGHT), (NEAR = 1), (FAR = 10000);

      scene = new Physijs.Scene();
      scene.setGravity(new THREE.Vector3(0, -50, 0));
      scene.addEventListener("update", function () {
        scene.simulate(undefined, 2);
      });

      renderer = new THREE.WebGLRenderer({
        antialias: true,
      });

      renderer.setSize(WIDTH, HEIGHT);
      renderer.shadowMapEnabled = true;
      renderer.shadowMapSoft = true;
      renderer.shadowMapType = THREE.PCFShadowMap;
      renderer.shadowMapAutoUpdate = true;

      container.appendChild(renderer.domElement);

      camera = new THREE.PerspectiveCamera(VIEW_ANGLE, ASPECT, NEAR, FAR);

      camera.position.set(150, 30, 0);
      // camera.position.set(0, 0, 150); // SIDE VIEW
      camera.lookAt(scene.position);
      scene.add(camera);

      light = new THREE.DirectionalLight(0xffffff);

      light.position.set(70, 70, 100);
      light.castShadow = true;
      light.shadowCameraLeft = -60;
      light.shadowCameraTop = -60;
      light.shadowCameraRight = 60;
      light.shadowCameraBottom = 60;
      light.shadowCameraNear = 1;
      light.shadowCameraFar = 1000;
      light.shadowBias = -0.0001;
      light.shadowMapWidth = light.shadowMapHeight = 1024;
      light.shadowDarkness = 0.7;
      light.target = scene;

      scene.add(light);

      // BOTTOM PLANE
      plane = new Physijs.BoxMesh(
        new THREE.CubeGeometry(10, 100, 2, 10, 10),
        Physijs.createMaterial(
          new THREE.MeshLambertMaterial({
            color: 0xeeeeee,
          }),
          0.4,
          0.99
        ),
        0
      );

      plane.rotation.x = -Math.PI / 2;
      plane.receiveShadow = true;
      plane.position.y = -40;

      // scene.add(plane);

      // BACK PLANE
      plane = new Physijs.BoxMesh(
        new THREE.CubeGeometry(100, 100, 2, 10, 10),
        Physijs.createMaterial(
          new THREE.MeshLambertMaterial({
            color: 0xeeeeee,
          }),
          0.4,
          0.99
        ),
        0
      );

      plane.rotation.x = -Math.PI / 2;
      plane.rotation.y = Math.PI / 2;
      plane.receiveShadow = true;
      plane.position.x = -4;

      scene.add(plane);

      // FRONT PLANE
      plane = new Physijs.BoxMesh(
        new THREE.CubeGeometry(100, 100, 2, 10, 10),
        Physijs.createMaterial(
          new THREE.MeshLambertMaterial({
            color: 0xeeeeee,
            transparent: true,
            opacity: 0.3,
          }),
          0.0,
          0.99
        ),
        0
      );

      plane.rotation.x = -Math.PI / 2;
      plane.rotation.y = -Math.PI / 2;
      plane.position.x = 4;

      scene.add(plane);

      // LEFT PLANE
      plane = new Physijs.BoxMesh(
        new THREE.CubeGeometry(10, 100, 2, 10, 10),
        Physijs.createMaterial(
          new THREE.MeshLambertMaterial({
            transparent: true,
            color: 0xeeeeee,
            opacity: 0.3,
          }),
          0.4,
          0.99
        ),
        0
      );

      plane.rotation.x = -Math.PI;
      plane.position.z = 50;

      scene.add(plane);

      // RIGHT PLANE
      plane = new Physijs.BoxMesh(
        new THREE.CubeGeometry(10, 100, 2, 10, 10),
        Physijs.createMaterial(
          new THREE.MeshLambertMaterial({
            transparent: true,
            color: 0xeeeeee,
            opacity: 0.3,
          }),
          0.4,
          0.99
        ),
        0
      );

      plane.rotation.x = -Math.PI;
      plane.position.z = -50;

      scene.add(plane);

      // PEGS
      for (var i = 0; i < 10; i++) {
        for (var j = 0; j < 11; j++) {
          var peg = new Physijs.CylinderMesh(
            new THREE.CylinderGeometry(1, 0, 8, 32),
            Physijs.createMaterial(
              new THREE.MeshLambertMaterial({
                color: 0xeeeeee,
              }),
              0.4,
              0.99
            ),
            0
          );

          peg.rotation.z = Math.PI / 2;
          if (i % 2 == 0) {
            peg.position.y = (i - 1) * 8 - 30;
            peg.position.z = j * 8 - 38;
          } else {
            peg.position.y = (i - 1) * 8 - 30;
            peg.position.z = j * 8 - 42;
          }

          scene.add(peg);
        }
      }

      setInterval(function () {
        // random color
        var color = Math.random() * 0xffffff;
        ball = new Physijs.SphereMesh(
          new THREE.SphereGeometry(2.5, 16, 16),
          Physijs.createMaterial(
            new THREE.MeshLambertMaterial({
              color: color,
              reflectivity: 0.8,
            }),
            0.4,
            0.99
          ),
          1
        );

        var r = {
          x: Math.random() * (Math.PI - Math.PI / 12) + Math.PI / 12,
          y: Math.random() * (Math.PI - Math.PI / 12) + Math.PI / 12,
          z: Math.random() * (Math.PI - Math.PI / 12) + Math.PI / 12,
        };

        ball.rotation.set(r.x, r.y, r.z);
        ball.position.z = Math.random() * 60 - 30;
        ball.position.y = 40;
        ball.castShadow = true;
        ball.receiveShadow = true;

        scene.add(ball);
      }, 1200);

      render();
      scene.simulate();

      function render() {
        for (var i = 5; i < scene.children.length - 5; i++) {
          var obj = scene.children[i];

          if (obj.position.y <= -50) {
            scene.remove(obj);
          }
        }

        renderer.render(scene, camera);
        requestAnimationFrame(render);
      }
    </script>
  </body>
</html>
